
server:
  ssl:
    bundle: appbundle

spring:
  http:
    client:
      factory: jdk
  ssl:
    bundle:
      jks:
        appbundle:
          key:
            alias: app
          keystore:
            location: app.p12
            password: password
            type: PKCS12

# Only need these if you want to connect to an existing local database from a local run (say, with the jar file)
# For integrationTest and bootTestRun, the integration tests will spin up a postgres instance, and we don't need these
